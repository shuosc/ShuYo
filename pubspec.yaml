name: shuyo
description: An unofficial, all-in-one utility app for SHU.
publish_to: "none"
version: 0.5.0+22

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  crop_your_image: ^2.0.1
  image_picker: ^1.2.4
  home_widget: ^0.9.3
  html: ^0.15.6
  http: ^1.6.0
  lunar: ^1.2.20
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.3
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  flutter_secure_storage: ^11.2.0
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/demo/README.md
    - assets/demo/academic/
    - assets/demo/announcements/
    - assets/demo/classroom/
    - assets/library_booking/
