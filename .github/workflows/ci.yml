name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            compare_base="$BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            compare_base="$BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            compare_base="HEAD^"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$compare_base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code_changed=false
          while IFS= read -r file; do
            case "$file" in
              *.md|LICENSE|LICENSE.*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md)
                ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$compare_base" HEAD)

          echo "code=$code_changed" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.changes.outputs.code == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        if: steps.changes.outputs.code == 'true'
        run: flutter analyze

      - name: Validate bundled contributors snapshot
        if: steps.changes.outputs.code == 'true'
        run: dart run tool/update_contributors.dart --check

      - name: Run tests
        if: steps.changes.outputs.code == 'true'
        run: flutter test

      - name: Skip Flutter checks for documentation-only changes
        if: steps.changes.outputs.code != 'true'
        run: echo "No application or build files changed."
