name: Set up project toolchain
description: Shared Java and Flutter versions for checks and Android releases.

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
        cache: gradle

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.50.0"
        channel: stable
        cache: true
